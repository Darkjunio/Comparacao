<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comparador Inteligente PRO</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {
    font-family: 'Segoe UI';
    background: #f1f5f9;
    margin: 0;
    padding: 20px;
}
.container {max-width: 1100px; margin:auto;}
.card {
    background:#fff;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,0.08);
}
input,button,select {
    width:100%;
    padding:10px;
    margin-top:10px;
}
button {
    background:#2563eb;
    color:#fff;
    border:none;
    cursor:pointer;
}
.loading {display:none;text-align:center;}
.spinner {
    border:4px solid #eee;
    border-top:4px solid #2563eb;
    border-radius:50%;
    width:40px;height:40px;
    margin:auto;
    animation:spin 1s linear infinite;
}
@keyframes spin {to{transform:rotate(360deg)}}
.tabela {
    width:100%;
    border-collapse:collapse;
    margin-top:10px;
}
.tabela th,.tabela td {
    border:1px solid #ddd;
    padding:6px;
}
.dif {background:#fee2e2;}
.ok {background:#dcfce7;}
.warn {background:#fef9c3;}
</style>
</head>

<body>

<div class="container">

<h2>📊 Comparador Inteligente PRO (Estilo PROCV)</h2>

<div class="card">
<input type="file" id="arquivo1">
<input type="file" id="arquivo2">
<button onclick="comparar()">Comparar</button>

<div class="loading" id="loading">
<div class="spinner"></div>
<p>Processando planilhas...</p>
</div>

<div id="info"></div>
<select id="colunaSelect" style="display:none;"></select>
</div>

<div class="card" id="resultado" style="display:none;">
<button onclick="exportar()">📥 Exportar Excel</button>

<h3>Resultado PROCV Inteligente</h3>
<div id="procv"></div>

</div>

</div>

<script>
let dadosGlobais = {};
let resultadoComparacao = {};

// ===== NORMALIZAÇÃO =====
function normalizar(txt){
    return String(txt || "")
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

// ===== SIMILARIDADE =====
function similar(a, b){
    a = normalizar(a);
    b = normalizar(b);

    if(a === b) return 1;
    if(!a || !b) return 0;

    let iguais = 0;
    const min = Math.min(a.length, b.length);

    for(let i=0;i<min;i++){
        if(a[i] === b[i]) iguais++;
    }

    return iguais / Math.max(a.length, b.length);
}

// ===== DETECTAR COLUNA =====
function detectarColuna(cols){
    const keys = ["id","codigo","processo","numero","nome"];
    const lower = cols.map(c=>c.toLowerCase());

    for(let k of keys){
        const i = lower.findIndex(c=>c.includes(k));
        if(i !== -1) return cols[i];
    }

    return cols[0];
}

// ===== LER =====
function lerArquivo(arq){
    return new Promise(res=>{
        const r = new FileReader();

        r.onload = e=>{
            const wb = XLSX.read(new Uint8Array(e.target.result), {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];

            const linhas = XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
            let idx = linhas.findIndex(l => l.length > 1);

            const dados = XLSX.utils.sheet_to_json(ws,{
                range: idx,
                defval:""
            });

            const cols = Object.keys(dados[0]);
            res({dados, coluna: detectarColuna(cols), cols});
        };

        r.readAsArrayBuffer(arq);
    });
}

// ===== COMPARAR =====
async function comparar(){
    const a1 = arquivo1.files[0];
    const a2 = arquivo2.files[0];

    if(!a1 || !a2){
        alert("Selecione os dois arquivos");
        return;
    }

    loading.style.display="block";

    const r1 = await lerArquivo(a1);
    const r2 = await lerArquivo(a2);

    loading.style.display="none";

    dadosGlobais = {r1, r2};

    colunaSelect.innerHTML = r1.cols.map(c=>`<option>${c}</option>`).join("");
    colunaSelect.value = r1.coluna;
    colunaSelect.style.display="block";

    info.innerHTML = `Coluna detectada: <b>${r1.coluna}</b>`;

    colunaSelect.onchange = () => executar(colunaSelect.value);

    executar(r1.coluna);
}

// ===== EXECUTAR (SOMENTE __EMPTY_1) =====
function executar(col){
    const {r1, r2} = dadosGlobais;

    const mapaExato = new Map();

    r2.dados.forEach(l=>{
        if(l[col]){
            mapaExato.set(normalizar(l[col]), l);
        }
    });

    let procv = [];

    const colunaAlvo = "__EMPTY_1";

    r1.dados.forEach(l1=>{
        const chave = normalizar(l1[col]);

        if(!chave) return;

        let l2 = mapaExato.get(chave);

        let score = 1;

        // fuzzy
        if(!l2){
            let melhor = null;
            let melhorScore = 0;

            for(let linha of r2.dados){
                const s = similar(l1[col], linha[col]);

                if(s > melhorScore){
                    melhorScore = s;
                    melhor = linha;
                }
            }

            if(melhorScore >= 0.85){
                l2 = melhor;
                score = melhorScore;
            }
        }

        if(!l2){
            procv.push({
                ID: l1[col],
                Status: "NÃO ENCONTRADO",
                Campo: colunaAlvo,
                Antes: "",
                Depois: "",
                Score: 0
            });
            return;
        }

        const v1 = l1[colunaAlvo] || "";
        const v2 = l2[colunaAlvo] || "";

        procv.push({
            ID: l1[col],
            Status: normalizar(v1) === normalizar(v2) ? "IGUAL" : "ALTERADO",
            Campo: colunaAlvo,
            Antes: v1,
            Depois: v2,
            Score: score
        });

    });

    resultadoComparacao = {procv};

    mostrar();
}

// ===== MOSTRAR =====
function mostrar(){
    resultado.style.display="block";

    let html = `<table class="tabela">
    <tr><th>ID</th><th>Status</th><th>Campo</th><th>Antes</th><th>Depois</th><th>Score</th></tr>`;

    resultadoComparacao.procv.forEach(p=>{
        let classe = p.Status === "IGUAL" ? "ok" : "dif";

        html += `<tr class="${classe}">
            <td>${p.ID}</td>
            <td>${p.Status}</td>
            <td>${p.Campo}</td>
            <td>${p.Antes}</td>
            <td>${p.Depois}</td>
            <td>${p.Score?.toFixed(2)}</td>
        </tr>`;
    });

    html += "</table>";

    procv.innerHTML = html;
}

// ===== EXPORTAR =====
function exportar(){
    const wb = XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb,
        XLSX.utils.json_to_sheet(resultadoComparacao.procv),
        "RESULTADO"
    );

    XLSX.writeFile(wb, "comparacao_empty1.xlsx");
}
</script>

</body>
</html>
