<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comparador Inteligente Avançado</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
body {font-family:'Segoe UI';background:#f1f5f9;margin:0;padding:20px;}
.container {max-width:1100px;margin:auto;}
.card {background:#fff;padding:20px;border-radius:10px;margin-bottom:20px;}
input,button,select {width:100%;padding:10px;margin-top:10px;}
button {background:#2563eb;color:#fff;border:none;cursor:pointer;}
.loading {display:none;text-align:center;}
.spinner {border:4px solid #eee;border-top:4px solid #2563eb;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:auto;}
@keyframes spin {to{transform:rotate(360deg)}}
.tabela {width:100%;border-collapse:collapse;margin-top:10px;}
.tabela td,.tabela th {border:1px solid #ddd;padding:6px;}
.dif {background:#fee2e2;}
.ok {background:#dcfce7;}
</style>
</head>

<body>

<div class="container">

<h2>📊 Comparador Inteligente (Excel Avançado)</h2>

<div class="card">
<input type="file" id="arquivo1">
<input type="file" id="arquivo2">
<button onclick="comparar()">Comparar</button>

<div class="loading" id="loading">
<div class="spinner"></div>
<p>Processando...</p>
</div>

<div id="info"></div>
<select id="colunaSelect" style="display:none;"></select>
</div>

<div class="card" id="resultado" style="display:none;">
<button onclick="exportar()">📥 Exportar Excel</button>

<h3>Resultado PROCV Inteligente</h3>
<div id="procv"></div>

<h3>Diferença Geral</h3>
<div id="geral"></div>
</div>

</div>

<script>
let dadosGlobais = {};
let resultadoComparacao = {};

function normalizar(txt){
    return String(txt)
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g,"")
        .trim();
}

// similaridade simples
function similar(a,b){
    a = normalizar(a);
    b = normalizar(b);
    if(a === b) return 1;
    return a.includes(b) || b.includes(a) ? 0.7 : 0;
}

function detectarColuna(cols){
    const keys=["id","codigo","processo","numero","nome"];
    const lower=cols.map(c=>c.toLowerCase());
    for(let k of keys){
        const i=lower.findIndex(c=>c.includes(k));
        if(i!=-1) return cols[i];
    }
    return cols[0];
}

function lerArquivo(arq){
    return new Promise(res=>{
        const r=new FileReader();
        r.onload=e=>{
            const wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
            const ws=wb.Sheets[wb.SheetNames[0]];
            const linhas=XLSX.utils.sheet_to_json(ws,{header:1,defval:""});
            let idx=linhas.findIndex(l=>l.length>1);
            const dados=XLSX.utils.sheet_to_json(ws,{range:idx,defval:""});
            const cols=Object.keys(dados[0]);
            res({dados,coluna:detectarColuna(cols),cols});
        };
        r.readAsArrayBuffer(arq);
    });
}

async function comparar(){
    const a1=arquivo1.files[0];
    const a2=arquivo2.files[0];
    if(!a1||!a2){alert("Selecione os arquivos");return;}

    loading.style.display="block";

    const r1=await lerArquivo(a1);
    const r2=await lerArquivo(a2);

    loading.style.display="none";

    dadosGlobais={r1,r2};

    colunaSelect.innerHTML=r1.cols.map(c=>`<option>${c}</option>`).join("");
    colunaSelect.value=r1.coluna;
    colunaSelect.style.display="block";

    info.innerHTML=`Coluna detectada: <b>${r1.coluna}</b>`;

    colunaSelect.onchange=()=>executar(colunaSelect.value);

    executar(r1.coluna);
}

function executar(col){
    const {r1,r2}=dadosGlobais;

    let procv=[];

    r1.dados.forEach(l1=>{
        let melhor=null;
        let melhorScore=0;

        r2.dados.forEach(l2=>{
            const score=similar(l1[col],l2[col]);
            if(score>melhorScore){
                melhorScore=score;
                melhor=l2;
            }
        });

        if(!melhor){
            procv.push({ID:l1[col],Status:"NÃO ENCONTRADO"});
            return;
        }

        const cols=[...new Set([...Object.keys(l1),...Object.keys(melhor)])];

        cols.forEach(c=>{
            const v1=l1[c]||"";
            const v2=melhor[c]||"";

            if(normalizar(v1)===normalizar(v2)){
                procv.push({ID:l1[col],Status:"IGUAL",Campo:c,Antes:v1,Depois:v2});
            }else{
                procv.push({ID:l1[col],Status:"ALTERADO",Campo:c,Antes:v1,Depois:v2});
            }
        });
    });

    resultadoComparacao.procv=procv;

    mostrar();
}

function mostrar(){
    resultado.style.display="block";

    let html=`<table class="tabela">
    <tr><th>ID</th><th>Status</th><th>Campo</th><th>Antes</th><th>Depois</th></tr>`;

    resultadoComparacao.procv.forEach(p=>{
        html+=`<tr class="${p.Status==='IGUAL'?'ok':'dif'}">
        <td>${p.ID}</td>
        <td>${p.Status}</td>
        <td>${p.Campo||""}</td>
        <td>${p.Antes||""}</td>
        <td>${p.Depois||""}</td>
        </tr>`;
    });

    html+="</table>";

    procv.innerHTML=html;
}

function exportar(){
    const wb=XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb,
        XLSX.utils.json_to_sheet(resultadoComparacao.procv),
        "PROCV"
    );

    XLSX.writeFile(wb,"comparacao_avancada.xlsx");
}
</script>

</body>
</html>
