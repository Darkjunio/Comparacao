<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Comparador Profissional</title>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<style>
:root {
    --primary: #2563eb;
    --bg: #f1f5f9;
    --card: #ffffff;
    --danger: #ef4444;
    --success: #22c55e;
}

body {
    margin:0;
    font-family: 'Segoe UI', sans-serif;
    background: var(--bg);
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

.header {
    text-align: center;
    margin-bottom: 30px;
}

.header h1 {
    font-size: 28px;
}

.card {
    background: var(--card);
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    margin-bottom: 20px;
    animation: fadeIn 0.4s ease;
}

input, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
}

button {
    background: var(--primary);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}

button:hover {
    transform: translateY(-1px);
    opacity: 0.9;
}

.loading {
    display:none;
    text-align:center;
    margin-top:15px;
}

.spinner {
    border: 4px solid #eee;
    border-top: 4px solid var(--primary);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    margin:auto;
    animation: spin 1s linear infinite;
}

.resultado {
    display:none;
}

.tag {
    display:inline-block;
    background:#e2e8f0;
    padding:5px 10px;
    margin:5px;
    border-radius:6px;
    font-size:14px;
}

.tabela {
    width:100%;
    border-collapse: collapse;
    margin-top:10px;
}

.tabela th, .tabela td {
    border:1px solid #ddd;
    padding:8px;
}

.dif {
    background:#fee2e2;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@keyframes fadeIn {
    from {opacity:0; transform:translateY(10px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>📊 Comparador de Planilhas</h1>
    <p>Sistema profissional de análise de dados</p>
</div>

<div class="card">
    <input type="file" id="arquivo1">
    <input type="file" id="arquivo2">
    <input type="text" id="coluna" placeholder="Coluna chave (ex: ID)">
    <button onclick="comparar()">Comparar</button>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <p>Processando planilhas...</p>
    </div>
</div>

<div class="card resultado" id="resultado">
    <button onclick="exportar()">📥 Exportar Excel</button>

    <h3>Apenas na Planilha 1</h3>
    <div id="apenas1"></div>

    <h3>Apenas na Planilha 2</h3>
    <div id="apenas2"></div>

    <h3>Alterações</h3>
    <div id="alterados"></div>
</div>

</div>

<script>
let resultadoComparacao = {};

function lerArquivo(arquivo, coluna) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = e => {
            const data = new Uint8Array(e.target.result);
            const wb = XLSX.read(data, {type:'array'});
            const ws = wb.Sheets[wb.SheetNames[0]];

            const linhas = XLSX.utils.sheet_to_json(ws,{header:1,defval:""});

            let idx=-1;
            const chave = coluna.toLowerCase().trim();

            for(let i=0;i<linhas.length;i++){
                const linha = linhas[i].map(c=>String(c).toLowerCase().trim());
                if(linha.includes(chave)){
                    idx=i;
                    break;
                }
            }

            if(idx===-1) return reject("Coluna não encontrada");

            const dados = XLSX.utils.sheet_to_json(ws,{
                defval:"",
                range: idx
            });

            resolve(dados);
        };

        reader.readAsArrayBuffer(arquivo);
    });
}

async function comparar() {
    const a1 = document.getElementById("arquivo1").files[0];
    const a2 = document.getElementById("arquivo2").files[0];
    const coluna = document.getElementById("coluna").value;

    if(!a1 || !a2 || !coluna){
        alert("Preencha tudo");
        return;
    }

    document.getElementById("loading").style.display="block";

    const d1 = await lerArquivo(a1,coluna);
    const d2 = await lerArquivo(a2,coluna);

    document.getElementById("loading").style.display="none";

    const m1=new Map(), m2=new Map();

    d1.forEach(l=>{if(l[coluna]) m1.set(l[coluna],l)});
    d2.forEach(l=>{if(l[coluna]) m2.set(l[coluna],l)});

    let apenas1=[], apenas2=[], alterados=[];

    for(let id of m1.keys()) if(!m2.has(id)) apenas1.push(id);
    for(let id of m2.keys()) if(!m1.has(id)) apenas2.push(id);

    for(let id of m1.keys()){
        if(m2.has(id)){
            const l1=m1.get(id), l2=m2.get(id);
            const cols=[...new Set([...Object.keys(l1),...Object.keys(l2)])];
            let difs=[];

            cols.forEach(c=>{
                if((l1[c]||"")!=(l2[c]||"")){
                    difs.push({c,v1:l1[c],v2:l2[c]});
                }
            });

            if(difs.length) alterados.push({id,difs});
        }
    }

    resultadoComparacao={apenas1,apenas2,alterados};
    mostrar();
}

function mostrar(){
    document.getElementById("resultado").style.display="block";

    document.getElementById("apenas1").innerHTML =
        resultadoComparacao.apenas1.map(i=>`<span class="tag">${i}</span>`).join("");

    document.getElementById("apenas2").innerHTML =
        resultadoComparacao.apenas2.map(i=>`<span class="tag">${i}</span>`).join("");

    let html="";
    resultadoComparacao.alterados.forEach(p=>{
        html+=`<h4>ID: ${p.id}</h4>`;
        html+=`<table class="tabela"><tr><th>Campo</th><th>Antes</th><th>Depois</th></tr>`;
        p.difs.forEach(d=>{
            html+=`<tr class="dif"><td>${d.c}</td><td>${d.v1}</td><td>${d.v2}</td></tr>`;
        });
        html+="</table>";
    });

    document.getElementById("alterados").innerHTML=html;
}

function exportar(){
    const wb=XLSX.utils.book_new();

    XLSX.utils.book_append_sheet(wb,
        XLSX.utils.json_to_sheet([
            {Tipo:"Apenas 1",Qtd:resultadoComparacao.apenas1.length},
            {Tipo:"Apenas 2",Qtd:resultadoComparacao.apenas2.length},
            {Tipo:"Alterados",Qtd:resultadoComparacao.alterados.length}
        ]),
        "Resumo"
    );

    XLSX.writeFile(wb,"comparacao.xlsx");
}
</script>

</body>
</html>
